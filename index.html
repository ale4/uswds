<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My USWDS Clone</title>

    <!-- USWDS initializer -->
    <script src="dist/js/uswds-init.min.js"></script>

    <!-- USWDS stylesheet -->
    <link rel="stylesheet" href="dist/css/uswds.min.css" />
  </head>
  <body>
    <header class="usa-header usa-header--basic">
      <div class="usa-nav-container">
        <div class="usa-navbar">
          <div class="usa-logo">
            <em class="usa-logo__text">My USWDS Site</em>
          </div>
        </div>
      </div>
    </header>

    <main class="usa-section">
      <div class="grid-container">
        <h1 class="usa-heading">Hello from USWDS</h1>
        <p class="usa-intro">
          This page is using the USWDS CSS, JS, and initializer from the cloned repo.
        </p>
        <button class="usa-button">USWDS button</button>
      </div>
    </main>

    <!-- USWDS JavaScript library -->
    <script src="dist/js/uswds.min.js"></script>
  </body>
</html>
